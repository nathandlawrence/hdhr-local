record:
  fields:
    show:
      required: false
      example: Night Report
      selector:
        text:
    mode:
      default: series
      selector:
        select:
          options:
            - series
            - next
    channel:
      example: "4.1"
      selector:
        text:
    series_id:
      example: C184061ENTOEP
      selector:
        text:
    start:
      example: 1794027660
      selector:
        number:
          min: 0
          max: 4102444800
          mode: box
tune:
  fields:
    player:
      required: true
      example: Living Room TV
      selector:
        text:
    channel:
      required: true
      example: "6.1"
      selector:
        text:
signal_test:
  fields:
    watch_entity:
      example: binary_sensor.dryer_power
      selector:
        entity:
    name:
      default: Dryer
      selector:
        text:
    channels:
      example: '["9.1", "4.1", "6.1"]'
      selector:
        object:
    after_minutes:
      default: 15
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
    max_hours:
      default: 3
      selector:
        number:
          min: 0.1
          max: 12
          step: 0.1
          unit_of_measurement: h
    notify:
      example: notify.mobile_app_my_phone
      selector:
        text:
    stop:
      default: false
      selector:
        boolean:
